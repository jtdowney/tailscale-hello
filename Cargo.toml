[package]
name = "tailscale-hello"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = { version = "0.8.9", features = ["tracing", "http2", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
futures = "0.3.34"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27.10", features = ["http2"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["axum"] }
rustls = "0.23.45"
tailscale-localapi = "0.6.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
